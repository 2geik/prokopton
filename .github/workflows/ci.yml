name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Nightly MPS / 4B run
    - cron: "17 3 * * *"

jobs:
  # Small-model CPU run on every PR. Deterministic, no downloads, < 1 minute.
  unit:
    name: unit tests (CPU, tiny model)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Regression + unit tests
        run: pytest -q --cov=prokopton --cov-report=term-missing
      - name: Import smoke test
        run: python -c "import prokopton; print(prokopton.__version__)"

  # The defect suite is the gate: these tests are the ones that would have
  # caught the catalogued bugs. Run them explicitly so a skip cannot hide them.
  regression:
    name: defect regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Phase 6 defect table
        run: |
          pytest -q tests/test_regression.py \
            -k "eval or trust or persistence or cms or layer or surprise or chat or momentum or replay or labels"
      - name: Anti-contamination gates
        run: pytest -q tests/test_eval.py -k "contamination or probe or token_span or Ablation or FullEvaluation"

  # Nightly: the real model on the real backend. Skipped on forks / without a
  # self-hosted Apple Silicon runner.
  mps-nightly:
    name: nightly MPS / Qwen3-VL-4B
    if: github.event_name == 'schedule' && github.repository_owner == github.actor
    runs-on: [self-hosted, macOS, ARM]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          python3.12 -m venv .venv
          .venv/bin/pip install -e ".[test]"
      - name: Acceptance (Phase 0/1/3)
        run: .venv/bin/python scripts/acceptance.py
      - name: Full test suite
        run: .venv/bin/python -m pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile
        run: python -m compileall -q prokopton tests
